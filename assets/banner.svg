<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#071018"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00d2ff"/><stop offset="50%" stop-color="#3a7bd5"/><stop offset="100%" stop-color="#00f2fe"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1b2a4a" stop-opacity=".75"/><stop offset="100%" stop-color="#0e1726" stop-opacity=".85"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1f2d4d" stroke-opacity=".45" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.04)}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes dataFlow{0%{stroke-dashoffset:120}}@keyframes orbMove{0%{transform:translate(0,0)}50%{transform:translate(25px,-15px)}}.ambient-orb{animation:pulseGlow 6s ease-in-out infinite alternate;transform-origin:center}.floating-card{animation:floatSlow 5s ease-in-out infinite}.flowing-stream{stroke-dasharray:8,8;animation:dataFlow 3s linear infinite}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;fill:#94a3b8}.badge-text{font-weight:600;font-size:11px;fill:#38bdf8}</style></defs><rect width="1200" height="360" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><circle cx="180" cy="80" r="130" fill="#00d2ff" class="ambient-orb" filter="url(#glow)" opacity=".15"/><circle cx="1020" cy="280" r="150" fill="#3a7bd5" class="ambient-orb" filter="url(#glow)" opacity=".18" style="animation-delay:-3s"/><circle cx="900" cy="90" r="110" fill="#00f2fe" class="ambient-orb" filter="url(#glow)" opacity=".12" style="animation-delay:-1.5s"/><path fill="none" stroke="#0284c7" stroke-width="2" d="M 120 290 Q 280 240, 480 280 T 880 260 T 1100 290" class="flowing-stream" opacity=".4"/><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 80 180 Q 240 210, 420 170 T 800 180 T 1120 150" class="flowing-stream" opacity=".25" style="animation-duration:4s"/><g class="floating-card" transform="translate(860, 45)"><rect width="280" height="68" x="0" y="0" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.2" rx="10"/><circle cx="34" cy="34" r="16" fill="#0284c7" fill-opacity=".25"/><text x="34" y="39" font-size="16" text-anchor="middle">🧊</text><text x="62" y="30" fill="#e2e8f0" class="badge-text" font-size="13">Apache Iceberg &amp; Delta</text><text x="62" y="49" class="subtitle-text" font-size="11">ACID &amp; Open Table Formats</text></g><g class="floating-card" transform="translate(820, 135)" style="animation-duration:6s;animation-delay:-1.5s"><rect width="300" height="68" x="0" y="0" fill="url(#cardGrad)" stroke="#60a5fa" stroke-opacity=".4" stroke-width="1.2" rx="10"/><circle cx="34" cy="34" r="16" fill="#2563eb" fill-opacity=".25"/><text x="34" y="39" font-size="16" text-anchor="middle">⚡</text><text x="62" y="30" fill="#e2e8f0" class="badge-text" font-size="13">Trino, DuckDB &amp; ClickHouse</text><text x="62" y="49" class="subtitle-text" font-size="11">Sub-Second Federated Analytics</text></g><g class="floating-card" transform="translate(860, 225)" style="animation-duration:5.5s;animation-delay:-3s"><rect width="280" height="68" x="0" y="0" fill="url(#cardGrad)" stroke="#00f2fe" stroke-opacity=".4" stroke-width="1.2" rx="10"/><circle cx="34" cy="34" r="16" fill="#0891b2" fill-opacity=".25"/><text x="34" y="39" font-size="16" text-anchor="middle">🏛️</text><text x="62" y="30" fill="#e2e8f0" class="badge-text" font-size="13">SaaS &amp; Open Source</text><text x="62" y="49" class="subtitle-text" font-size="11">Zero Lock-in Data Architectures</text></g><g transform="translate(80, 75)"><rect width="230" height="28" x="0" y="0" fill="#0369a1" fill-opacity=".3" stroke="#38bdf8" stroke-width="1" rx="14"/><circle cx="14" cy="14" r="4" fill="#38bdf8"/><text x="26" y="18" class="badge-text">LAKEHOUSE ARCHITECTURE</text><text x="0" y="78" class="title-text" font-size="40">Awesome Lakehouse &amp;</text><text x="0" y="126" fill="url(#primaryGlow)" class="title-text" font-size="40">Data Storage Ecosystem</text><text x="0" y="165" class="subtitle-text" font-size="15.5">Curated index of open table formats, ultra-fast query engines,</text><text x="0" y="188" class="subtitle-text" font-size="15.5">managed cloud lakehouses &amp; sovereign data storage technologies.</text><g transform="translate(0, 218)"><rect width="88" height="26" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="44" y="17" fill="#cbd5e1" class="badge-text" font-size="11" text-anchor="middle">📊 Iceberg</text><rect width="76" height="26" x="98" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="136" y="17" fill="#cbd5e1" class="badge-text" font-size="11" text-anchor="middle">📐 Delta</text><rect width="74" height="26" x="184" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="221" y="17" fill="#cbd5e1" class="badge-text" font-size="11" text-anchor="middle">🔥 Hudi</text><rect width="76" height="26" x="268" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="306" y="17" fill="#cbd5e1" class="badge-text" font-size="11" text-anchor="middle">⚡ Trino</text><rect width="88" height="26" x="354" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="398" y="17" fill="#cbd5e1" class="badge-text" font-size="11" text-anchor="middle">🦆 DuckDB</text><rect width="98" height="26" x="452" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="501" y="17" fill="#cbd5e1" class="badge-text" font-size="11" text-anchor="middle">🚀 Polaris</text></g></g></svg>