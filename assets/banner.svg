<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#071018" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3a7bd5" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a4a" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0e1726" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2d4d" stroke-width="0.8" stroke-opacity="0.45" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.04); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes dataFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbMove {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(25px, -15px); }
      }
      .ambient-orb {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .floating-card {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .flowing-stream {
        stroke-dasharray: 8, 8;
        animation: dataFlow 3s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="180" cy="80" r="130" fill="#00d2ff" opacity="0.15" filter="url(#glow)" class="ambient-orb" />
  <circle cx="1020" cy="280" r="150" fill="#3a7bd5" opacity="0.18" filter="url(#glow)" class="ambient-orb" style="animation-delay: -3s;" />
  <circle cx="900" cy="90" r="110" fill="#00f2fe" opacity="0.12" filter="url(#glow)" class="ambient-orb" style="animation-delay: -1.5s;" />

  <!-- Decorative Connected Circuit / Flow Lines -->
  <path d="M 120 290 Q 280 240, 480 280 T 880 260 T 1100 290" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.4" class="flowing-stream" />
  <path d="M 80 180 Q 240 210, 420 170 T 800 180 T 1120 150" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" class="flowing-stream" style="animation-duration: 4s;" />

  <!-- Right Side Interactive Feature Cards (Floating in Background Behind Text Plane) -->
  <g class="floating-card" transform="translate(860, 45)">
    <!-- Card 1: Iceberg & Open Formats -->
    <rect x="0" y="0" width="280" height="68" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="34" cy="34" r="16" fill="#0284c7" fill-opacity="0.25" />
    <text x="34" y="39" text-anchor="middle" font-size="16">🧊</text>
    <text x="62" y="30" class="badge-text" fill="#e2e8f0" font-size="13px">Apache Iceberg &amp; Delta</text>
    <text x="62" y="49" class="subtitle-text" font-size="11px">ACID &amp; Open Table Formats</text>
  </g>

  <g class="floating-card" transform="translate(820, 135)" style="animation-duration: 6s; animation-delay: -1.5s;">
    <!-- Card 2: Query Federation -->
    <rect x="0" y="0" width="300" height="68" rx="10" fill="url(#cardGrad)" stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="34" cy="34" r="16" fill="#2563eb" fill-opacity="0.25" />
    <text x="34" y="39" text-anchor="middle" font-size="16">⚡</text>
    <text x="62" y="30" class="badge-text" fill="#e2e8f0" font-size="13px">Trino, DuckDB &amp; ClickHouse</text>
    <text x="62" y="49" class="subtitle-text" font-size="11px">Sub-Second Federated Analytics</text>
  </g>

  <g class="floating-card" transform="translate(860, 225)" style="animation-duration: 5.5s; animation-delay: -3s;">
    <!-- Card 3: Cloud & Sovereign Storage -->
    <rect x="0" y="0" width="280" height="68" rx="10" fill="url(#cardGrad)" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="34" cy="34" r="16" fill="#0891b2" fill-opacity="0.25" />
    <text x="34" y="39" text-anchor="middle" font-size="16">🏛️</text>
    <text x="62" y="30" class="badge-text" fill="#e2e8f0" font-size="13px">SaaS &amp; Open Source</text>
    <text x="62" y="49" class="subtitle-text" font-size="11px">Zero Lock-in Data Architectures</text>
  </g>

  <!-- Left Main Content Area (Clean, Unobscured Foreground) -->
  <g transform="translate(80, 75)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="230" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8" />
    <text x="26" y="18" class="badge-text">LAKEHOUSE ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="78" class="title-text" font-size="40px">
      Awesome Lakehouse &amp;
    </text>
    <text x="0" y="126" class="title-text" font-size="40px" fill="url(#primaryGlow)">
      Data Storage Ecosystem
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="165" class="subtitle-text" font-size="15.5px">
      Curated index of open table formats, ultra-fast query engines,
    </text>
    <text x="0" y="188" class="subtitle-text" font-size="15.5px">
      managed cloud lakehouses &amp; sovereign data storage technologies.
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 218)">
      <rect x="0" y="0" width="88" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="44" y="17" text-anchor="middle" class="badge-text" font-size="11px" fill="#cbd5e1">📊 Iceberg</text>

      <rect x="98" y="0" width="76" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="136" y="17" text-anchor="middle" class="badge-text" font-size="11px" fill="#cbd5e1">📐 Delta</text>

      <rect x="184" y="0" width="74" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="221" y="17" text-anchor="middle" class="badge-text" font-size="11px" fill="#cbd5e1">🔥 Hudi</text>

      <rect x="268" y="0" width="76" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="306" y="17" text-anchor="middle" class="badge-text" font-size="11px" fill="#cbd5e1">⚡ Trino</text>

      <rect x="354" y="0" width="88" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="398" y="17" text-anchor="middle" class="badge-text" font-size="11px" fill="#cbd5e1">🦆 DuckDB</text>

      <rect x="452" y="0" width="98" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="501" y="17" text-anchor="middle" class="badge-text" font-size="11px" fill="#cbd5e1">🚀 Polaris</text>
    </g>
  </g>
</svg>
